name: Édition quotidienne

# Enveloppe mince autour de bin/edition.sh, qui fait tout le travail et se lance aussi à la main :
# collecte des flux → rubriques du jour en parallèle → éditorial → site.
# L'édition et le journal de consommation sont ensuite commités sur la branche principale ;
# Vercel redéploie le site à chaque push.

on:
  schedule:
    # 04:17 UTC ≈ 6 h 17 à Paris (heure d'été) / 5 h 17 (heure d'hiver)
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date de l'édition (AAAA-MM-JJ, vide = aujourd'hui)"
        required: false
        default: ""
      rubriques:
        description: "Rubriques à produire (ids séparés par des virgules, vide = le plan du jour)"
        required: false
        default: ""

concurrency:
  group: edition-quotidienne
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation de Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Tests
        run: npm test

      - name: Production de l'édition
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VEILLEUR_MODELE: ${{ vars.MODELE_REDACTION }}
          PARALLELE: "3"
          DATE_EDITION: ${{ inputs.date }}
          RUBRIQUES: ${{ inputs.rubriques }}
        run: bin/edition.sh "$DATE_EDITION" "$RUBRIQUES"

      - name: Brouillons rejetés (pour examen)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: brouillons-rejetes
          path: content/*/*.rejete
          if-no-files-found: ignore
          retention-days: 14

      - name: Publication dans le dépôt
        if: ${{ !cancelled() }}
        run: |
          git config user.name "La rédaction (agents)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          if [ -d journal ]; then git add journal/; fi
          git commit -m "Édition du ${DATE_EDITION:-$(node bin/plan.mjs --aujourdhui)}" || { echo "Rien de nouveau"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        env:
          DATE_EDITION: ${{ inputs.date }}

      - name: Redéploiement Vercel (hook facultatif)
        if: ${{ !cancelled() }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" > /dev/null; fi
