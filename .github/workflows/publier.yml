name: Publier le site

# Construit le site statique et le publie sur GitHub Pages.
# Déclenché à chaque push, à la main, ou à la fin de l'édition quotidienne.

on:
  push:
    paths:
      - "content/**"
      - "assets/**"
      - "scripts/**"
      - "site.config.json"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Après l'édition quotidienne, prendre le commit qu'elle vient de pousser.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
        id: pages
      - run: node scripts/build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
